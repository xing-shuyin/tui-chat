[project]
name = "tui-chat"
version = "0.1.0"
description = "A modern, asynchronous Terminal User Interface (TUI) chat client built with Textual & uv"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "rich>=15.0.0",
    "textual>=8.2.8",
]

[project.scripts]
tui-chat = "tui_chat:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

